version: "3.8"

services:
  # Flask application
  app:
    build:
      context: ..          # Build context is the REPO ROOT (parent of docker/)
      dockerfile: docker/Dockerfile
    image: devops-ia3-app:latest
    container_name: devops-ia3-app
    environment:
      - APP_VERSION=${APP_VERSION:-1.0.0}
    expose:
      - "8000"             # Only expose to internal network, not to host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - devops-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: devops-ia3-nginx
    ports:
      - "80:80"            # Expose port 80 on host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - devops-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  devops-net:
    driver: bridge
    name: devops-ia3-network
# Cloud-init configuration for VM initialization
# Reliable install of Docker, git, and app directory on Ubuntu 22.04
# Runs on first boot only

#cloud-config

# Update package index on first boot
package_update: true

# Install git and curl (needed for Docker install script)
packages:
  - git
  - curl

# Commands to run after packages are installed
runcmd:
  # Install Docker using official convenience script
  - curl -fsSL https://get.docker.com | sh

  # Add admin user to docker group (allows docker without sudo)
  - usermod -aG docker ${admin_username}

  # Enable Docker to start on boot
  - systemctl enable docker
  - systemctl start docker

  # Create app directory owned by admin user
  - mkdir -p /opt/app
  - chown ${admin_username}:${admin_username} /opt/app

  # Write version file for reference
  - echo "${app_version}" > /opt/app/VERSION
  - chown ${admin_username}:${admin_username} /opt/app/VERSION

  # Write repo URL for reference
  - echo "${github_repo_url}" > /opt/app/GITHUB_REPO
  - chown ${admin_username}:${admin_username} /opt/app/GITHUB_REPO

# Final message when cloud-init completes
final_message: |
  Cloud-init complete. Docker and git installed.
  App directory: /opt/app (owned by ${admin_username})
  Version: ${app_version}